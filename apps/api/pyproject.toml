[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "neel26ray@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.97",
    "celery[redis]>=5.6.3",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.5",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "strands-agents>=1.56.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto>=5.2.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
